# Copiar a secret-sqlserver.local.yaml (ignorado por git) y poner la contraseña real:
#   cp secret-sqlserver.example.yaml secret-sqlserver.local.yaml
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver-secret
type: Opaque
stringData: # Texto plano; Kubernetes lo guarda codificado en base64 en "data"
  MSSQL_SA_PASSWORD: "<contraseña de sa>"
