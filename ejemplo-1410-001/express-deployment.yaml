apiVersion: apps/v1
kind: Deployment
metadata:
  name: servidor-express-deployment
  labels:
    app: servidor-express-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servidor-express-deployment
  template:
    metadata:
      labels:
        app: servidor-express-deployment
    spec:
      restartPolicy: Always
      containers:
        - name: servidor-express-c
          image: servidor-express:v4
          imagePullPolicy: Never # La imagen se cargó con "minikube image load"; no existe en ningún registro
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: servidor-express-service
spec:
  selector:
    app: servidor-express-deployment
  type: NodePort
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
