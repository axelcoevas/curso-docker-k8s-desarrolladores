apiVersion: v1
kind: Service
metadata:
  name: desarrollo-express-service
  namespace: namespace-desarrollo
spec:
  selector:
    app: servidor-express
  type: NodePort
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
